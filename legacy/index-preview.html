    <script src="script.js"></script>
    
    <script>
        // Fetch posters from TMDB for all shows
        async function fetchPreviewPosters() {
            const headers = { 'Authorization': `Bearer ${TMDB_TOKEN}` };
            const watchlist = JSON.parse(localStorage.getItem('watchlist') || '[]');
            
            for (let show of watchlist) {
                if (show.tmdbId && !show.poster) {
                    try {
                        const endpoint = show.isMovie ? 'movie' : 'tv';
                        const response = await fetch(`https://api.themoviedb.org/3/${endpoint}/${show.tmdbId}`, { headers });
                        const data = await response.json();
                        if (data.poster_path) {
                            show.poster = TMDB_IMAGE_BASE + data.poster_path;
                        }
                    } catch (error) {
                        console.error(`Error fetching poster for ${show.title}:`, error);
                    }
                }
            }
            
            // Save updated shows with posters
            localStorage.setItem('watchlist', JSON.stringify(watchlist));
            
            // Re-render to show posters
            if (typeof renderWatchlist === 'function') {
                renderWatchlist();
            }
        }

        // Wait for page to load, then fetch posters
        window.addEventListener('load', function() {
            // Fetch posters after initial render
            setTimeout(fetchPreviewPosters, 500);
        });
    </script>
</body>
